    <script>
      (function () {
        try {
          var s = localStorage.getItem('chore-theme')
          var d = window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', s ? s === 'dark' : d)
        } catch (e) { document.documentElement.classList.add('dark') }
      })()
    </script>
