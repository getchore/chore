name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace --locked

  # The release job builds six targets on five runners. This checks the three
  # that nothing else covers -- musl, the darwin cross, and windows-gnu -- on
  # every PR, so a linking break surfaces before a tag is pushed rather than
  # after.
  cross:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # The least-exercised target in the tree: the only one where both C
          # dependencies, ring and zstd-sys, build against mingw rather than
          # msvc or a system compiler. Cross-compiled from Linux, where the
          # toolchain is one apt package at a known path -- the Windows images
          # move their mingw around between releases.
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # rustup's rust-mingw component supplies the import libraries, but ring
      # and zstd-sys compile real C, so the build needs a mingw gcc too.
      - if: endsWith(matrix.target, '-windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      - env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} --bin chore
      - if: endsWith(matrix.target, '-linux-musl')
        run: |
          bin=target/${{ matrix.target }}/release/chore
          file "$bin"
          # The whole point of musl here: no interpreter, no shared objects.
          # `ldd` says "statically linked" for a static binary and "not a
          # dynamic executable" for a static-pie one, depending on which libc
          # provides it -- both are the answer we want. A real dependency
          # shows up as a `lib... => ...` mapping line.
          out=$(ldd "$bin" 2>&1 || true)
          echo "$out"
          if printf '%s\n' "$out" | grep -q '=>'; then
            echo "::error::binary is dynamically linked"
            exit 1
          fi
      # Nothing links against a system library here, so the .exe should stand
      # alone apart from the Windows API DLLs every process loads.
      - if: endsWith(matrix.target, '-windows-gnu')
        run: |
          exe=target/${{ matrix.target }}/release/chore.exe
          test -f "$exe" || { echo "::error::no binary at $exe"; exit 1; }
          deps=$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/.*DLL Name: *//p')
          echo "$deps"
          # libgcc / libstdc++ / libwinpthread would mean the binary needs the
          # mingw runtime installed on the user's machine, which it must not.
          if printf '%s\n' "$deps" | grep -qiE '^(libgcc|libstdc|libwinpthread)'; then
            echo "::error::binary depends on the mingw runtime"
            exit 1
          fi

  # The installers are shipped from main, not from a release asset, so a
  # broken one is live the moment it merges.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: shellcheck --shell=sh installers/install.sh
      - name: Check installers/install.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./installers/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'installers/install.ps1 parses'
