name: ci

# chore runs chore. Every job here bootstraps with exactly one native cargo
# invocation -- `cargo build --release --bin chore` -- and then drives the
# rest of the job through the binary that build produced.
#
# The binary is built from the commit under test, never installed from the
# v1.0.0 release. Installing the released binary would be faster and it would
# be wrong: a PR that breaks the interpreter would still go green, because the
# tasks would have been run by the old binary rather than the new one. The
# point of CI is that the chorefile in this commit works when read by the
# chore in this commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
      - name: Build chore
        run: cargo build --release --locked --bin chore
      # `lint` is `cargo fmt --all --check` then
      # `cargo clippy --workspace --all-targets --locked -- -D warnings`.
      - run: ./target/release/chore lint

  test:
    name: test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
      - name: Build chore
        run: cargo build --release --locked --bin chore
      # `test` is `cargo test --workspace --locked`. The forward slashes are
      # fine on the Windows runners: both pwsh and git-bash resolve
      # `./target/release/chore` to the .exe.
      - run: ./target/release/chore test

  # The release job builds six targets on five runners. This checks the three
  # that nothing else covers -- musl, the darwin cross, and windows-gnu -- on
  # every PR, so a linking break surfaces before a tag is pushed rather than
  # after.
  cross:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # The least-exercised target in the tree: the only one where both C
          # dependencies, ring and zstd-sys, build against mingw rather than
          # msvc or a system compiler. Cross-compiled from Linux, where the
          # toolchain is one apt package at a known path -- the Windows images
          # move their mingw around between releases.
          - target: x86_64-pc-windows-gnu
            runner: ubuntu-latest
    # Target-scoped, so they are inert for the host bootstrap build below and
    # only take effect for the cross builds. Hoisted to the job because two
    # steps -- `chore cross` and `chore static-check` -- both need them.
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
    steps:
      - uses: actions/checkout@v5
      # `chore cross` runs `rustup target add` itself; the toolchain has to
      # exist before either that or the bootstrap build can run.
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # rustup's rust-mingw component supplies the import libraries, but ring
      # and zstd-sys compile real C, so the build needs a mingw gcc too.
      - if: endsWith(matrix.target, '-windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc --version
      # Host build, so this is a native binary that runs here even when the
      # matrix target is Windows.
      - name: Build chore
        run: cargo build --release --locked --bin chore
      # `cross <target>` is `rustup target add <target>` then
      # `cargo build --release --locked --target <target> --bin chore`.
      - run: ./target/release/chore cross ${{ matrix.target }}
      # `static-check` is `cross x86_64-unknown-linux-musl` followed by the
      # assertion that the binary has no shared-library mapping -- no `lib...
      # => ...` line from ldd. Its cross build is the one the previous step
      # just did, so it is a cargo no-op here.
      #
      # The assertion has to tolerate both spellings: `ldd` prints "statically
      # linked" for a static binary and "not a dynamic executable" for a
      # static-pie one, depending on which libc answers, and both are what we
      # want. Only a `=>` mapping is a real dependency.
      - if: endsWith(matrix.target, '-linux-musl')
        run: ./target/release/chore static-check
      # Left inline deliberately. This assertion needs
      # x86_64-w64-mingw32-objdump, which exists only on this one cross job;
      # as a chore task it would be dead weight in every developer checkout,
      # and there is no task in the chorefile for it.
      #
      # Nothing links against a system library here, so the .exe should stand
      # alone apart from the Windows API DLLs every process loads.
      - if: endsWith(matrix.target, '-windows-gnu')
        run: |
          exe=target/${{ matrix.target }}/release/chore.exe
          test -f "$exe" || { echo "::error::no binary at $exe"; exit 1; }
          deps=$(x86_64-w64-mingw32-objdump -p "$exe" | sed -n 's/.*DLL Name: *//p')
          echo "$deps"
          # libgcc / libstdc++ / libwinpthread would mean the binary needs the
          # mingw runtime installed on the user's machine, which it must not.
          if printf '%s\n' "$deps" | grep -qiE '^(libgcc|libstdc|libwinpthread)'; then
            echo "::error::binary depends on the mingw runtime"
            exit 1
          fi

  # The installers are shipped from main, not from a release asset, so a
  # broken one is live the moment it merges.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --no-self-update
      # Provisioning, not a check. shellcheck has to be on PATH before the
      # task runs; pwsh is already on the ubuntu image, which is what keeps
      # the install.ps1 parse check running rather than being skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Build chore
        run: cargo build --release --locked --bin chore
      # `installers` is `shellcheck --shell=sh installers/install.sh` then the
      # PowerShell parse check of installers/install.ps1, which the task runs
      # only when pwsh exists.
      - run: ./target/release/chore installers
