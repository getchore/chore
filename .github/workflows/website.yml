name: website

on:
  push:
    branches: [main]
    paths: &site
      - 'website/**'
      # The installers are published by the site, so a fix to them has to
      # redeploy Pages, not just sit on main.
      - 'installers/**'
      - '.github/workflows/website.yml'
  # Build on pull requests too, without deploying. Otherwise nothing checks
  # the site before it merges: `ci.yml` covers the Rust workspace only, so a
  # website that does not compile goes green and is discovered on main.
  pull_request:
    paths: *site
  workflow_dispatch:

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        # Project pages are served from /<repo>/, so the asset base must match.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - name: SPA fallback + skip Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    needs: build
    # A pull request gets the build for its answer, and nothing else: it must
    # not publish, and a fork's token could not anyway.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
